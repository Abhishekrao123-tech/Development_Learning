<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Stopwatch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f8;
        }

        .stopwatch-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }

        .display {
            font-size: 3rem;
            font-weight: bold;
            color: #2c3e50;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 24px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        #startBtn {
            background-color: #2ecc71;
            color: white;
        }

        #startBtn:hover {
            background-color: #27ae60;
        }

        #pauseBtn {
            background-color: #f39c12;
            color: white;
        }

        #pauseBtn:hover {
            background-color: #d35400;
        }

        #resetBtn {
            background-color: #e74c3c;
            color: white;
        }

        #resetBtn:hover {
            background-color: #c0392b;
        }

        button:disabled {
            background-color: #bdc3c7 !important;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="stopwatch-card">
        <div class="display" id="display">00:00:00</div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        // Variables to keep track of elapsed time
        let seconds = 0;
        let minutes = 0;
        let hours = 0;

        // Stores the ID returned by setInterval so we can clear it later
        let timerId = null;

        // DOM Elements
        const displayElement = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Function to format time and update the HTML display
        function updateDisplay() {
            // String.padStart(2, '0') adds a leading 0 if the string length is less than 2
            const formattedHours = String(hours).padStart(2, '0');
            const formattedMinutes = String(minutes).padStart(2, '0');
            const formattedSeconds = String(seconds).padStart(2, '0');

            displayElement.textContent = `${formattedHours}:${formattedMinutes}:${formattedSeconds}`;
        }

        // Timer logic executed every 1 second (1000ms)
        function tick() {
            seconds++;

            if (seconds >= 60) {
                seconds = 0;
                minutes++;
                if (minutes >= 60) {
                    minutes = 0;
                    hours++;
                }
            }

            updateDisplay();
        }

        // 1. START BUTTON
        startBtn.addEventListener('click', () => {
            // Prevent creating multiple intervals if Start is clicked repeatedly
            if (timerId !== null) return;

            // Start repeating execution every 1000ms (1 second)
            timerId = setInterval(tick, 1000);

            // Toggle button states
            startBtn.disabled = true;
            pauseBtn.disabled = false;
        });

        // 2. PAUSE BUTTON
        pauseBtn.addEventListener('click', () => {
            // Stop the interval loop using clearInterval
            clearInterval(timerId);
            timerId = null;

            // Toggle button states
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        });

        // 3. RESET BUTTON
        resetBtn.addEventListener('click', () => {
            // Stop the interval loop
            clearInterval(timerId);
            timerId = null;

            // Reset values back to zero
            seconds = 0;
            minutes = 0;
            hours = 0;

            // Reset UI
            updateDisplay();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        });
    </script>
</body>

</html>
