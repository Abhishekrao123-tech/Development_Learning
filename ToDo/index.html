<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo-List</title>
    <link rel="Stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="ta-container">
            <div class="heading">
                <h1>ToDo List</h1>
            </div>
            <div class="ta-wrapper">
                <div class="input-wrapper">
                    <input type="text" id="todo-input">
                    <button id="submit">Add</button>
                </div>
                <div class="todo-lists">
                    <div class="todo-item">
                        <div>
                            <input type="text" class="todo" readonly="readonly">
                        </div>
                        <div class="action-items">
                            <i class="fa-solid fa-square-check" style="color: rgb(34, 46, 85);"></i>
                        <i class="fa-regular fa-pen-to-square" style="color: rgb(34, 46, 85);"></i>
                        <i class="fa-solid fa-trash" style="color: rgb(34, 46, 85);"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/js/all.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
